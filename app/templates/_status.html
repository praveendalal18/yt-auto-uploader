{# Status badge: colour + text (not colour alone). Expects `ch` (a Channel or None). #}
{% if not ch or not ch.connected %}
<span class="inline-block rounded-full bg-slate-200 text-slate-700 text-xs px-2 py-0.5">Not connected</span>
{% elif ch.token_status == 'ok' %}
<span class="inline-block rounded-full bg-green-100 text-green-800 text-xs px-2 py-0.5">● Connected</span>
{% else %}
<span class="inline-block rounded-full bg-red-100 text-red-800 text-xs px-2 py-0.5">● Expired — reconnect</span>
{% endif %}
