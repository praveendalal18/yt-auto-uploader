{% extends "base.html" %}
{% block title %}{{ status }} · Studio Scheduler{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white rounded-xl shadow p-8 text-center">
  <h1 class="text-xl font-semibold mb-2">{% if status == 403 %}Access denied{% elif status == 404 %}Not found{% else %}Something went wrong{% endif %}</h1>
  <p class="text-sm text-slate-600 mb-6">{{ message }}</p>
  <a href="/login" class="text-sm underline">Back to sign in</a>
</div>
{% endblock %}
