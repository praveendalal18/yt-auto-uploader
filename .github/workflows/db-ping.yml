# Daily keep-alive for the database: calls the deployed app's /healthz/db once a day,
# which writes + reads one tiny Firestore document (system/heartbeat).
# Setup (after the app is deployed in Phase 7): Repo Settings > Secrets and variables > Actions > add
#   APP_URL     = the Cloud Run URL, e.g. https://web-xxxxx-el.a.run.app
#   PING_TOKEN  = same value as the app's PING_TOKEN env var
# Until both secrets exist, this workflow just skips (it does not fail).
name: Daily DB ping
on:
  schedule:
    - cron: "17 3 * * *"        # every day 03:17 UTC = 08:47 IST
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PING_TOKEN: ${{ secrets.PING_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$PING_TOKEN" ]; then
            echo "APP_URL / PING_TOKEN secrets not set yet - skipping."; exit 0
          fi
          # Retries cover Cloud Run cold starts.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 60 -H "X-Ping-Token: $PING_TOKEN" "$APP_URL/healthz/db"
